[block]
type = "modbus_tag"
name = "Modbus: тег"
symbol = "MB TAG"
group = "Сеть"
shared = "network"
description = "Значение регистра или бита устройства Modbus: читается из устройства или пишется в него, в зависимости от связей."

[[input]]
name = "in"
type = "int"
when = 'kind == "int"'
optional = true
description = "Значение для записи в устройство (подключите, чтобы писать)"

[[input]]
name = "in_f"
type = "float"
when = 'kind == "float"'
optional = true
description = "Значение float для записи в устройство (займёт два регистра)"

[[input]]
name = "in_b"
type = "bool"
when = 'kind == "bool"'
optional = true
description = "Состояние бита для записи в устройство"

[[output]]
name = "out"
type = "int"
fast = true
when = 'kind == "int"'
description = "Значение регистра, прочитанное из устройства"

[[output]]
name = "out_f"
type = "float"
fast = true
when = 'kind == "float"'
description = "Значение двух регистров как float"

[[output]]
name = "out_b"
type = "bool"
when = 'kind == "bool"'
description = "Состояние бита"

[[output]]
name = "ok"
type = "bool"
description = "true, пока устройство отвечает"

[[param]]
name = "device"
type = "string"
default = ""
description = "Идентификатор устройства: блока «Modbus: slave у master» или блока Modbus Slave этой платы"

[[param]]
name = "table"
type = "string"
default = "holding"
description = "Таблица: holding, input, coil или discrete"

[[param.choice]]
value = "holding"
label = "Holding (4x, регистры хранения)"

[[param.choice]]
value = "input"
label = "Input (3x, входные регистры)"

[[param.choice]]
value = "coil"
label = "Coil (0x, катушки)"

[[param.choice]]
value = "discrete"
label = "Discrete (1x, дискретные входы)"

[[param]]
name = "kind"
type = "string"
default = "int"
description = "Тип значения: int (1 регистр), float (2 регистра) или bool (катушка, вход)"

[[param.choice]]
value = "int"
label = "Целое (1 регистр)"

[[param.choice]]
value = "float"
label = "Дробное float (2 регистра)"

[[param.choice]]
value = "bool"
label = "Бит (катушка, вход)"

[[param]]
name = "reg"
type = "int"
default = 0
min = 0
description = "Адрес в таблице"

[[param]]
name = "swap"
type = "bool"
default = false
when = 'kind == "float"'
label = "Слова наоборот"
description = "Поменять местами два 16-битных слова float (младшее слово первым)"
