[block]
type = "dht22"
name = "DHT22"
symbol = "DHT22"
group = "Датчики"
description = "Датчик температуры и влажности DHT22 (AM2302)."
memory = true
includes = ["DHT.h"]
libraries = ["DHT sensor library", "Adafruit Unified Sensor"]

[[output]]
name = "temp"
sim = 21.5
type = "float"
fast = true
description = "Температура, °C"

[[output]]
name = "humidity"
sim = 45.0
type = "float"
fast = true
description = "Относительная влажность, %"

[[output]]
name = "ok"
sim = true
type = "bool"
description = "true, если последнее чтение удалось"

[[param]]
name = "pin"
type = "pin"
description = "Вывод данных датчика"

[[param]]
name = "period"
type = "duration"
default = "2s"
min = 2000
description = "Период опроса; DHT22 нельзя опрашивать чаще раза в 2 секунды"
