[block]
type = "modbus_tcp_master"
name = "Modbus TCP Master"
symbol = "MB TCP M"
group = "Сеть"
shared = "network"
description = "Ведущее устройство Modbus TCP через Wi-Fi или Ethernet: опрашивает ведомые устройства (Unit ID) на одном сервере, добавленные под ним в левой панели."
single = true

[[param]]
name = "net"
type = "string"
label = "Сеть"
default = "wifi"
description = "Сеть: wifi (блок «Wi-Fi клиент») или ethernet (блок «Ethernet»)"

[[param.choice]]
value = "wifi"
label = "Wi-Fi"

[[param.choice]]
value = "ethernet"
label = "Ethernet"

[[param]]
name = "ip"
type = "string"
default = "192.168.1.10"
description = "IP-адрес сервера Modbus TCP (устройства, которое опрашиваем)"

[[param]]
name = "port"
type = "int"
default = 502
min = 1
max = 65535
description = "TCP-порт сервера"

[[param]]
name = "slaves"
label = "Макс. slave"
type = "int"
default = 4
min = 1
max = 32
description = "Сколько устройств может опрашивать этот master (ОЗУ на плате растёт с числом)"

[[param]]
name = "period"
type = "duration"
default = "1s"
min = 10
description = "Период опроса каждого ведомого"

[[param]]
name = "timeout"
type = "duration"
default = "1s"
min = 10
description = "Время ожидания ответа"
