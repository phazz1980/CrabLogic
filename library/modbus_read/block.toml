[block]
type = "modbus_read"
name = "Чтение Modbus"
symbol = "MB ←"
group = "Сеть"
shared = "network"
description = "Читает значение из таблицы Modbus TCP Slave (то, что записал мастер)."

[[output]]
name = "out"
type = "int"
fast = true
when = 'kind == "int"'
description = "Значение регистра"

[[output]]
name = "out_f"
type = "float"
fast = true
when = 'kind == "float"'
description = "Значение двух регистров как float"

[[output]]
name = "out_b"
type = "bool"
when = 'kind == "bool"'
description = "Состояние бита"

[[param]]
name = "slave"
type = "string"
default = "tcp"
description = "Чьи таблицы: tcp (Modbus TCP Slave) или rtu (Modbus RTU Slave)"

[[param.choice]]
value = "tcp"
label = "Modbus TCP Slave"

[[param.choice]]
value = "rtu"
label = "Modbus RTU Slave"

[[param]]
name = "table"
type = "string"
default = "holding"
description = "Таблица: holding, input, coil или discrete"

[[param.choice]]
value = "holding"
label = "Holding (4x, регистры хранения)"

[[param.choice]]
value = "input"
label = "Input (3x, входные регистры)"

[[param.choice]]
value = "coil"
label = "Coil (0x, катушки)"

[[param.choice]]
value = "discrete"
label = "Discrete (1x, дискретные входы)"

[[param]]
name = "kind"
type = "string"
default = "int"
description = "Тип значения: int (1 регистр), float (2 регистра) или bool (катушка, вход)"

[[param.choice]]
value = "int"
label = "Целое (1 регистр)"

[[param.choice]]
value = "float"
label = "Дробное float (2 регистра)"

[[param.choice]]
value = "bool"
label = "Бит (катушка, вход)"

[[param]]
name = "reg"
type = "int"
default = 0
min = 0
description = "Адрес в таблице"

[[param]]
name = "swap"
label = "Слова наоборот"
type = "bool"
default = false
when = 'kind == "float"'
description = "Поменять местами два регистра float (порядок CDAB вместо ABCD): так делают некоторые системы SCADA и панели"
