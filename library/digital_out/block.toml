[block]
type = "digital_out"
name = "Цифровой выход"
symbol = "DO"
group = "Входы и выходы"
description = "Выставляет логический уровень на выводе платы."
expander = true

[[input]]
name = "in"
type = "bool"
description = "true — высокий уровень (или низкий при инверсии)"

[[input]]
name = "en"
type = "bool"
default = true
when = "write_enable"
description = "Разрешение записи: пока false, выход сохраняет прежнее состояние"

[[param]]
name = "pin"
type = "pin"
mode = "out"
description = "Номер вывода GPIO"

[[param]]
name = "inverted"
type = "bool"
default = false
description = "Инвертировать выход (для реле, включаемых низким уровнем)"

[[param]]
name = "write_enable"
type = "bool"
default = false
description = "Добавить вход «Разрешение записи» (en)"

[[param]]
name = "on_fault"
label = "при аварии"
type = "int"
default = 0
min = 0
max = 2
description = "Что делает мастер с выводом, когда модуль упал (ошибка, зависание) или выгружен: выключить, включить или оставить как есть"

[[param.choice]]
value = 0
label = "выключить"

[[param.choice]]
value = 1
label = "включить"

[[param.choice]]
value = 2
label = "держать"
