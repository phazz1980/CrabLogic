[block]
type = "modbus_rtu_slave"
name = "Modbus RTU Slave"
symbol = "MB RTU"
group = "Сеть"
shared = "network"
description = "Ведомое устройство Modbus RTU на UART (RS-485): таблицы регистров для мастера."
single = true

[block.uart]
param = "uart"
access = "exclusive"

[[output]]
name = "error"
type = "int"
description = "Код последней ошибки Modbus (0 — нет ошибки)"

[[param]]
name = "uart"
label = "UART"
type = "int"
default = 2
min = 0
max = 2
description = "Номер UART: 1 или 2 (на ESP32-C3 только 1); скорость, формат и выводы — в настройках платы"

[[param.choice]]
value = 0
label = "UART0"

[[param.choice]]
value = 1
label = "UART1"

[[param.choice]]
value = 2
label = "UART2"

[[param]]
name = "address"
type = "int"
default = 1
min = 1
max = 247
description = "Адрес устройства"

