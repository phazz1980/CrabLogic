[block]
type = "lora_centre"
name = "LoRa: центр"
symbol = "LoRa-центр"
group = "Радио"
description = "Центр LoRa на стороне ведомого: выходы — полученные команды, входы — значения, которые уйдут центру в ответ. Схема ведомого работает и без связи."
memory = true

[[param]]
name = "modem"
label = "Модем"
type = "string"
default = ""
of_block = "lora_e220"
description = "Идентификатор блока lora_e220 (роль «ведомый»), через который идёт обмен"

