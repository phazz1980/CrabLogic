[block]
type = "modbus_master_write"
name = "Запись Modbus Master"
symbol = "MM →"
group = "Сеть"
shared = "network"
description = "Записывает значение в ведомое устройство через блок «Modbus RTU Master» или «Modbus TCP Master»."

[[input]]
name = "in"
type = "int"
when = 'kind == "int"'
description = "Значение регистра"

[[input]]
name = "in_f"
type = "float"
when = 'kind == "float"'
description = "Значение float (займёт два регистра)"

[[input]]
name = "in_b"
type = "bool"
when = 'kind == "bool"'
description = "Состояние бита"

[[param]]
name = "slave"
type = "int"
default = 1
min = 1
max = 247
description = "Адрес ведомого (адрес в «Modbus RTU Master» или Unit ID в «Modbus TCP Master»)"

[[param]]
name = "table"
type = "string"
default = "holding"
description = "Таблица: holding или coil (только их мастер может записать)"

[[param.choice]]
value = "holding"
label = "Holding (4x, регистры хранения)"

[[param.choice]]
value = "input"
label = "Input (3x, входные регистры)"

[[param.choice]]
value = "coil"
label = "Coil (0x, катушки)"

[[param.choice]]
value = "discrete"
label = "Discrete (1x, дискретные входы)"

[[param]]
name = "kind"
type = "string"
default = "int"
description = "Тип значения: int (1 регистр), float (2 регистра) или bool (катушка)"

[[param.choice]]
value = "int"
label = "Целое (1 регистр)"

[[param.choice]]
value = "float"
label = "Дробное float (2 регистра)"

[[param.choice]]
value = "bool"
label = "Бит (катушка, вход)"

[[param]]
name = "reg"
type = "int"
default = 0
min = 0
description = "Адрес в таблице"

[[param]]
name = "master"
type = "string"
default = "rtu"
description = "Чей опрос: rtu («Modbus RTU Master») или tcp («Modbus TCP Master»)"

[[param.choice]]
value = "rtu"
label = "Modbus RTU Master"

[[param.choice]]
value = "tcp"
label = "Modbus TCP Master"
