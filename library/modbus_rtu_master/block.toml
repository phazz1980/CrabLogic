[block]
type = "modbus_rtu_master"
name = "Modbus RTU Master"
symbol = "MB MASTER"
group = "Сеть"
shared = "network"
description = "Ведущее устройство Modbus RTU на UART (RS-485): опрашивает ведомые устройства, добавленные под ним в левой панели."
single = true

[block.uart]
param = "uart"
access = "exclusive"

[[param]]
name = "uart"
label = "UART"
type = "int"
default = 2
min = 0
max = 2
description = "Номер UART: 1 или 2 (на ESP32-C3 только 1); скорость, формат и выводы — в настройках платы"

[[param.choice]]
value = 0
label = "UART0"

[[param.choice]]
value = 1
label = "UART1"

[[param.choice]]
value = 2
label = "UART2"

[[param]]
name = "slaves"
label = "Макс. slave"
type = "int"
default = 4
min = 1
max = 32
description = "Сколько устройств может опрашивать этот master (ОЗУ на плате растёт с числом)"

[[param]]
name = "period"
type = "duration"
default = "1s"
min = 10
description = "Период опроса каждого ведомого"

[[param]]
name = "timeout"
type = "duration"
default = "1s"
min = 10
description = "Время ожидания ответа"
