[block]
type = "disp_icon"
name = "Значок на экране"
symbol = "ICO"
group = "Экран дисплея"
description = "Значок из встроенного набора на экране дисплея."
memory = true

[[param]]
name = "icon"
show = "value"
type = "string"
label = "Значок"
default = "thermometer"
description = "Значок из встроенного набора"

[[param.choice]]
value = "thermometer"
label = "Термометр"

[[param.choice]]
value = "drop"
label = "Капля"

[[param.choice]]
value = "fan"
label = "Вентилятор"

[[param.choice]]
value = "lamp"
label = "Лампа"

[[param.choice]]
value = "alarm"
label = "Тревога"

[[param.choice]]
value = "wifi"
label = "Wi-Fi"

[[param.choice]]
value = "check"
label = "Галочка"

[[param.choice]]
value = "cross"
label = "Крестик"

[[param]]
name = "font"
type = "int"
label = "Размер"
default = 16
description = "Размер значка в пикселях (только OLED; на LCD значок занимает одно знакоместо)"

[[param.choice]]
value = 8
label = "8 пикселей"

[[param.choice]]
value = 16
label = "16 пикселей"

[[param]]
name = "display"
show = "hidden"
type = "string"
label = "Дисплей"
default = ""
description = "Идентификатор блока дисплея (oled или lcd), на экране которого стоит виджет"

[[param]]
name = "screen"
show = "hidden"
type = "int"
label = "Экран"
default = 1
min = 1
description = "Номер экрана дисплея (1, 2, …)"

[[param]]
name = "x"
show = "hidden"
type = "int"
label = "Столбец"
default = 0
min = 0
description = "Левый край: пиксель OLED или знакоместо LCD (с нуля)"

[[param]]
name = "y"
show = "hidden"
type = "int"
label = "Строка"
default = 0
min = 0
description = "Верхний край: пиксель OLED или знакоместо LCD (с нуля)"

[[param]]
name = "w"
show = "hidden"
type = "int"
label = "Ширина"
default = 16
min = 1
description = "Ширина: пиксели OLED или знакоместа LCD"

[[param]]
name = "h"
show = "hidden"
type = "int"
label = "Высота"
default = 16
min = 1
description = "Высота: пиксели OLED или знакоместа LCD"
