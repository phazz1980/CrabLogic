[block]
type = "lora_point"
name = "LoRa: slave"
symbol = "LoRa-вед"
group = "Радио"
description = "Один узел-slave LoRa на стороне master: команды уходят ему, ответы приходят от него. Модем (lora_e220) с ролью «master» стоит на том же листе."
memory = true

[[param]]
name = "modem"
label = "Модем"
type = "string"
default = ""
of_block = "lora_e220"
description = "Идентификатор блока lora_e220 (роль «master»), через который идёт обмен"

[[param]]
name = "node"
label = "Адрес slave"
type = "int"
default = 0
min = 0
max = 14
description = "Адрес slave узла 0…14: у slave такой же в блоке lora_e220; у одного master адреса разные"


[[param]]
name = "cmd_struct"
label = "Структура команд"
type = "string"
default = ""
description = "Имя структуры проекта, поля которой — команды master → slave (bool, int, float; до 10). Тогда значения идут через структуру, а числа и типы значений ниже не нужны; у обоих концов связи структуры одного состава"

[[param]]
name = "ans_struct"
label = "Структура ответов"
type = "string"
default = ""
description = "Имя структуры проекта, поля которой — ответы slave → master (bool, int, float; до 10). Тогда значения идут через структуру, а числа и типы значений ниже не нужны; у обоих концов связи структуры одного состава"

