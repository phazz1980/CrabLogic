[block]
type = "modbus_master_read"
name = "Чтение Modbus Master"
symbol = "MM ←"
group = "Сеть"
shared = "network"
description = "Читает значение ведомого устройства, опрошенного блоком «Modbus RTU Master» или «Modbus TCP Master»."

[[output]]
name = "out"
type = "int"
fast = true
when = 'kind == "int"'
description = "Значение регистра"

[[output]]
name = "out_f"
type = "float"
fast = true
when = 'kind == "float"'
description = "Значение двух регистров как float"

[[output]]
name = "out_b"
type = "bool"
when = 'kind == "bool"'
description = "Состояние бита"

[[output]]
name = "ok"
type = "bool"
description = "true, пока ведомый отвечает"

[[param]]
name = "slave"
type = "int"
default = 1
min = 1
max = 247
description = "Адрес ведомого (адрес в «Modbus RTU Master» или Unit ID в «Modbus TCP Master»)"

[[param]]
name = "table"
type = "string"
default = "input"
description = "Таблица: holding, input, coil или discrete"

[[param.choice]]
value = "holding"
label = "Holding (4x, регистры хранения)"

[[param.choice]]
value = "input"
label = "Input (3x, входные регистры)"

[[param.choice]]
value = "coil"
label = "Coil (0x, катушки)"

[[param.choice]]
value = "discrete"
label = "Discrete (1x, дискретные входы)"

[[param]]
name = "kind"
type = "string"
default = "int"
description = "Тип значения: int (1 регистр), float (2 регистра) или bool (катушка, вход)"

[[param.choice]]
value = "int"
label = "Целое (1 регистр)"

[[param.choice]]
value = "float"
label = "Дробное float (2 регистра)"

[[param.choice]]
value = "bool"
label = "Бит (катушка, вход)"

[[param]]
name = "reg"
type = "int"
default = 0
min = 0
description = "Адрес в таблице"

[[param]]
name = "master"
type = "string"
default = "rtu"
description = "Чей опрос: rtu («Modbus RTU Master») или tcp («Modbus TCP Master»)"

[[param.choice]]
value = "rtu"
label = "Modbus RTU Master"

[[param.choice]]
value = "tcp"
label = "Modbus TCP Master"
