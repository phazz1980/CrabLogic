[block]
type = "pwm_out"
name = "ШИМ-выход"
symbol = "PWM"
group = "Входы и выходы"
description = "Выдаёт ШИМ на вывод: 0 % — всегда выключен, 100 % — всегда включён."

[[input]]
name = "in"
type = "float"
description = "Заполнение, % (0…100; значения вне диапазона ограничиваются)"

[[input]]
name = "en"
type = "bool"
default = true
when = "write_enable"
description = "Разрешение записи: пока false, выход сохраняет прежнее состояние"

[[param]]
name = "pin"
type = "pin"
mode = "pwm"
description = "Номер вывода GPIO"

[[param]]
name = "write_enable"
type = "bool"
default = false
description = "Добавить вход «Разрешение записи» (en)"

[[param]]
name = "on_fault"
label = "при аварии"
type = "int"
default = 0
min = 0
max = 2
description = "Что делает мастер с выводом, когда модуль упал (ошибка, зависание) или выгружен: выключить, включить или оставить как есть"

[[param.choice]]
value = 0
label = "выключить"

[[param.choice]]
value = 1
label = "включить"

[[param.choice]]
value = 2
label = "держать"
