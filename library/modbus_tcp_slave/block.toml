[block]
type = "modbus_tcp_slave"
name = "Modbus TCP Slave"
symbol = "MB TCP"
group = "Сеть"
shared = "network"
description = "Ведомое устройство Modbus TCP через Wi-Fi или Ethernet: таблицы регистров для SCADA и панелей."
single = true

[[output]]
name = "error"
type = "int"
description = "Код последней ошибки Modbus (0 — нет ошибки)"

[[param]]
name = "net"
type = "string"
label = "Сеть"
default = "wifi"
description = "Сеть: wifi (блок «Wi-Fi клиент») или ethernet (блок «Ethernet»)"

[[param.choice]]
value = "wifi"
label = "Wi-Fi"

[[param.choice]]
value = "ethernet"
label = "Ethernet"

[[param]]
name = "address"
type = "int"
default = 1
min = 1
max = 247
description = "Адрес устройства (Unit ID)"

[[param]]
name = "port"
type = "int"
default = 502
min = 1
max = 65535
description = "TCP-порт"

