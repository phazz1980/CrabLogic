# Posts a published release to the Telegram channel. Needs the secret TELEGRAM_BOT_TOKEN
# (a bot made with @BotFather that is an administrator of the channel with the right to post).
# Run it by hand from the Actions tab to send the latest release again.
name: Telegram release post

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  # The channel the post goes to; a public channel works by its @name.
  TELEGRAM_CHAT: "@Crablogic"

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Send the release to the channel
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # A token pasted into the secret may carry a newline or spaces: they break the URL.
          TELEGRAM_BOT_TOKEN=$(printf '%s' "${TELEGRAM_BOT_TOKEN:-}" | tr -d '[:space:]')
          # Only the shape is reported, never the value: a bot token looks like 123456789:AA...
          if ! printf '%s' "$TELEGRAM_BOT_TOKEN" | grep -Eq '^[0-9]{6,12}:[A-Za-z0-9_-]{30,}$'; then
            echo "::warning::TELEGRAM_BOT_TOKEN does not look like <digits>:<letters> (length ${#TELEGRAM_BOT_TOKEN}); check the secret"
          fi
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "TELEGRAM_BOT_TOKEN is not set; nothing to send"
            exit 1
          fi
          tag="$EVENT_TAG"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag=$(gh release view --repo "$REPO" --json tagName --jq .tagName)
          fi
          title=$(gh release view "$tag" --repo "$REPO" --json name --jq .name)
          body=$(gh release view "$tag" --repo "$REPO" --json body --jq .body)
          url="https://github.com/$REPO/releases/tag/$tag"
          # Turn the Markdown of the release into Telegram HTML: bold title and headings,
          # bullets, inline code, links; cut on a whole line so no tag is left open.
          # Telegram takes up to 4096 characters; keep room for the title and the link.
          text=$(TITLE="$title" BODY="$body" URL="$url" python3 - <<'PY'
          import html, os, re

          def inline(s):
              s = html.escape(s, quote=False)
              s = re.sub(r"`([^`]+)`", r"<code>\1</code>", s)
              s = re.sub(r"\*\*([^*]+)\*\*", r"<b>\1</b>", s)
              s = re.sub(r"\[([^\]]+)\]\((https?://[^)\s]+)\)", r'<a href="\2">\1</a>', s)
              return s

          lines, size, cut = [], 0, False
          for raw in os.environ["BODY"].replace("\r", "").split("\n"):
              line = raw.rstrip()
              m = re.match(r"^#{1,6}\s+(.*)$", line)
              if m:
                  out = "<b>" + inline(m.group(1)) + "</b>"
              elif re.match(r"^\s*[-*]\s+", line):
                  out = "• " + inline(re.sub(r"^\s*[-*]\s+", "", line))
              else:
                  out = inline(line)
              if size + len(out) > 3300:
                  cut = True
                  break
              lines.append(out)
              size += len(out) + 1
          body = re.sub(r"\n{3,}", "\n\n", "\n".join(lines)).strip()
          if cut:
              body += "\n…"
          url = os.environ["URL"]
          print("🦀 <b>" + html.escape(os.environ["TITLE"], quote=False) + "</b>\n\n" + body
                + '\n\n<a href="' + url + '">Полные заметки на GitHub</a>')
          PY
          )
          # --fail-with-body puts the answer of Telegram (a wrong token or chat) into the log.
          curl --fail-with-body --silent --show-error \
            --data-urlencode "chat_id=$TELEGRAM_CHAT" \
            --data-urlencode "text=$text" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
          echo "sent $tag"
