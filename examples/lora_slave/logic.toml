# Slave LoRa (адрес 0): те же типы значений, что у блока pump_node master.
[[block]]
id = "modem"
type = "lora_e220"
role = 1
node = 0
channel = 18
uart = 2
tx = 17
rx = 16
m0 = 25
m1 = 27
aux = 33

[[block]]
id = "centre"
type = "lora_centre"
modem = "modem"
n_cmd = 2
t_cmd0 = 0
t_cmd1 = 1
n_ans = 2
t_ans0 = 1
t_ans1 = 0

[[block]]
id = "sensor"
type = "analog_in"
pin = 34

[[block]]
id = "pump"
type = "digital_out"
pin = 26

[[link]]
from = "centre.cmd0b"
to   = "pump.in"

[[link]]
from = "sensor.out"
to   = "centre.ans0i"

[[link]]
from = "centre.cmd0b"
to   = "centre.ans1b"
