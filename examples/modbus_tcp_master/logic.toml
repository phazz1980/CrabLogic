# Modbus TCP Master через Wi-Fi.
# Опрашивает устройство 192.168.1.50 (его можно собрать из примера modbus_wifi):
# читает температуру float из input 0..1 (показывает на веб-странице), а кнопка этой платы включает его coil 0.

[[block]]
id = "wifi"
type = "wifi"
ssid = "MyNetwork"

[[block]]
id = "master"
type = "modbus_tcp_master"
ip = "192.168.1.50"
period = "500ms"

[[block]]
id = "sensor_dev"
type = "modbus_device"
master = "master"
unit = 1

[[block]]
id = "temp"
type = "modbus_tag"
device = "sensor_dev"
table = "input"
kind = "float"
reg = 0

[[block]]
id = "button"
type = "digital_in"
pin = 13
pullup = true
inverted = true

[[block]]
id = "led_reg"
type = "modbus_tag"
device = "sensor_dev"
table = "coil"
kind = "bool"
reg = 0

[[block]]
id = "online_led"
type = "digital_out"
pin = 2

[[block]]
id = "page"
type = "web_ui"
title = "Modbus TCP Master"

[[block]]
id = "temp_shown"
type = "web_value"
caption = "Температура"
unit = "°C"
decimals = 1

[[link]]
from = "button.out"
to   = "led_reg.in_b"

[[link]]
from = "temp.ok"
to   = "online_led.in"

[[link]]
from = "temp.out_f"
to   = "temp_shown.in"
