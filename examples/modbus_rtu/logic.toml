# Шлюз Modbus RTU.
# Мастер (UART2) опрашивает два ведомых: у датчика (адрес 10)
# читает температуру float из input 0..1, а у модуля реле (адрес 11) включает coil 0.
# Slave (UART1, адрес 1) отдаёт панели оператора:
# input 0..1 — температура, discrete 0 — датчик на связи; coil 0 панели включает реле.

[[block]]
id = "master"
type = "modbus_rtu_master"
uart = 2
period = "500ms"

[[block]]
id = "temp_dev"
type = "modbus_device"
master = "master"
unit = 10

[[block]]
id = "relay_dev"
type = "modbus_device"
master = "master"
unit = 11

[[block]]
id = "panel"
type = "modbus_rtu_slave"
uart = 1
address = 1

[[block]]
id = "temp"
type = "modbus_tag"
device = "temp_dev"
table = "input"
kind = "float"
reg = 0

[[block]]
id = "temp_out"
type = "modbus_tag"
device = "panel"
table = "input"
kind = "float"
reg = 0

[[block]]
id = "sensor_ok"
type = "modbus_tag"
device = "panel"
table = "discrete"
kind = "bool"
reg = 0

[[block]]
id = "relay_cmd"
type = "modbus_tag"
device = "panel"
table = "coil"
kind = "bool"
reg = 0

[[block]]
id = "relay"
type = "modbus_tag"
device = "relay_dev"
table = "coil"
kind = "bool"
reg = 0

[[link]]
from = "temp.out_f"
to   = "temp_out.in_f"

[[link]]
from = "temp.ok"
to   = "sensor_ok.in_b"

[[link]]
from = "relay_cmd.out_b"
to   = "relay.in_b"
