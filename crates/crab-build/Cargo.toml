[package]
name = "crab-build"
description = "Putting CrabLogic onto a board: the Rust master firmware and WASM sheet modules"
version.workspace = true
edition.workspace = true

[dependencies]
crab-codegen = { path = "../crab-codegen" }
crab-core = { path = "../crab-core" }
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
sha2 = "0.10"
crab-debug = { path = "../crab-debug", features = ["net"] }
wasmparser = "0.263"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
espflash = { version = "4.7", default-features = false, features = ["serialport"] }
serialport = { version = "4", default-features = false }
