<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrabLogic — веб-интерфейс</title>
<link rel="stylesheet" href="/common.css">
<style>
#unpl .un { display: block; width: 100%; text-align: left; margin: 0 0 4px; cursor: grab; }
#unpl .un span { color: var(--muted); font-size: 11px; }
#grid { position: relative; margin-bottom: 14px; border-radius: 8px; border: 1px dashed var(--line); }
.item { position: absolute; background: var(--card); border: 1.5px solid var(--line); border-radius: 7px;
  padding: 3px 8px; overflow: hidden; cursor: grab; user-select: none; touch-action: none; font-size: 12px; }
.item.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.item b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item span { color: var(--muted); font-size: 11px; }
.item .rs { position: absolute; right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize;
  background: linear-gradient(135deg, transparent 50%, var(--accent) 50%); }
#preview { width: 100%; height: calc(100vh - 150px); min-height: 360px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
#grid.drop { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Веб-интерфейс ESP32</h1>
  <button id="addHost" hidden>Добавить блок «Веб-интерфейс»</button>
  <span class="hint" id="hostHint"></span>
  <a class="navlink" href="/screens">Экраны дисплеев →</a>
</header>

<aside id="palette" hidden></aside>

<main>
  <div class="row" id="modeRow" style="margin-bottom:10px">
    <button id="modeEdit" class="mode on">Редактор</button>
    <button id="modeView" class="mode" title="Та же страница, что в прошивке">Предпросмотр</button>
  </div>
  <div id="tabs"></div>
  <div id="grid"></div>
  <iframe id="preview" title="Предпросмотр" hidden></iframe>
</main>

<aside id="side"><div id="unpl"></div><div id="props"></div></aside>
<div id="status"></div>
<div id="version">v{{VERSION}}</div>

<script src="/common.js"></script>
<script>
const GROUP = "Веб-интерфейс";
const COLS = 24, CW = 30, CH = 22, GAP = 4;
let pageHtml = "", curPage = 1, previewMode = false;

const isWidget = (b) => b.type.startsWith("web_") && b.type !== "web_ui" && !b.tag;
const widgetParam = bp;
const placed = (b) => num(widgetParam(b, "row", 0), 0) >= 1;
const pageOf = (b) => Math.max(1, num(widgetParam(b, "page", 1), 1));
function pageNames(host) {
  const n = host ? String(widgetParam(host, "pages", "Главная")).split(";").map((x) => x.trim()) : [];
  return n.length && n.some((x) => x) ? n : ["Главная"];
}
function rect(b) {
  return {
    c: num(widgetParam(b, "col", 1), 1), r: Math.max(1, num(widgetParam(b, "row", 0), 0)),
    w: num(widgetParam(b, "w", 6), 6), h: num(widgetParam(b, "h", 2), 2),
  };
}

function render() {
  applyVisibility();
  const all = blocksOf().filter(isWidget);
  const host = (schema.logic.block || []).find((b) => b.type === "web_ui");
  const names = pageNames(host);
  if (curPage > names.length) curPage = names.length;
  const widgets = all.filter((b) => placed(b) && Math.min(pageOf(b), names.length) === curPage);
  const wifi = (schema.logic.block || []).find((b) => b.type === "wifi");
  $("addHost").hidden = !!host;
  $("hostHint").textContent = !wifi
    ? "В схеме нет блока Wi-Fi: без него страница не заработает."
    : (host ? "" : "Страница появится в прошивке после добавления блока «Веб-интерфейс».");

  // grid
  const g = $("grid");
  g.textContent = "";
  const rows = Math.max(16, ...widgets.map((b) => rect(b).r + rect(b).h));
  g.style.width = COLS * (CW + GAP) - GAP + "px";
  g.style.height = rows * (CH + GAP) - GAP + "px";
  g.style.backgroundImage = "linear-gradient(var(--cell) 1px, transparent 1px), linear-gradient(90deg, var(--cell) 1px, transparent 1px)";
  g.style.backgroundSize = `${CW + GAP}px ${CH + GAP}px`;
  for (const b of widgets) g.appendChild(itemEl(b));

  renderTabs(names, host);
  renderUnplaced(all);
  renderWidgetPalette();
  renderProps();
  renderPreview(all, host);
}

// widgets added in the editor (row 0) wait here until they are put on a page
function bottomRow() {
  return Math.max(0, ...(schema.logic.block || []).filter((b) => isWidget(b) && placed(b) && pageOf(b) === curPage).map((b) => rect(b).r + rect(b).h - 1));
}
function putWidget(b, c, r) {
  const w = rect(b);
  return act(async () => {
    await api("set_params", { id: b.id, params: { page: curPage, col: Math.max(1, Math.min(COLS - w.w + 1, c)), row: Math.max(1, r) } });
    selected = b.id;
  });
}
function renderUnplaced(all) {
  const el = $("unpl");
  el.textContent = "";
  const list = all.filter((b) => !placed(b));
  if (!list.length) return;
  const h = document.createElement("h2");
  h.textContent = `Не размещённые (${list.length})`;
  el.appendChild(h);
  const hint = document.createElement("p");
  hint.className = "hint";
  hint.textContent = "Перетащите на страницу или щёлкните — виджет встанет в конец текущей страницы.";
  el.appendChild(hint);
  for (const b of list) {
    const btn = document.createElement("button");
    btn.className = "un";
    btn.draggable = true;
    const cap = document.createElement("b");
    cap.textContent = String(widgetParam(b, "caption", b.id));
    const sub = document.createElement("span");
    sub.textContent = ` ${types[b.type] ? types[b.type].name : b.type} · ${b.id}`;
    btn.append(cap, sub);
    btn.onclick = () => putWidget(b, 1, bottomRow() + 1);
    btn.ondragstart = (ev) => { ev.dataTransfer.setData("text/plain", b.id); dragging = true; };
    btn.ondragend = () => { dragging = false; };
    el.appendChild(btn);
  }
}
// a drop on the grid: a palette widget type is added at the drop cell, an unplaced widget is moved there
const dropCell = (ev) => {
  const box = $("grid").getBoundingClientRect();
  return [Math.floor((ev.clientX - box.left) / (CW + GAP)) + 1, Math.floor((ev.clientY - box.top) / (CH + GAP)) + 1];
};
acceptDrops($("grid"), (type, ev) => addWidget(type, ...dropCell(ev)), (ev) => {
  const b = blocksOf().find((x) => x.id === ev.dataTransfer.getData("text/plain") && isWidget(x));
  if (b) putWidget(b, ...dropCell(ev));
});

function renderTabs(names, host) {
  const t = $("tabs");
  t.textContent = "";
  names.forEach((n, i) => {
    const btn = document.createElement("button");
    btn.textContent = n || `Страница ${i + 1}`;
    btn.className = i + 1 === curPage ? "on" : "";
    btn.onclick = () => { curPage = i + 1; selected = null; render(); };
    t.appendChild(btn);
  });
  const add = document.createElement("button");
  add.textContent = "＋ страница";
  add.title = "Добавить страницу: слева на странице устройства появится меню";
  add.onclick = () => act(async () => {
    if (!host) await api("add_block", { type: "web_ui", id: "ui" });
    const id = host ? host.id : "ui";
    await api("set_params", { id, params: { pages: [...names, `Страница ${names.length + 1}`].join(";") } });
    curPage = names.length + 1;
  });
  t.appendChild(add);
  if (names.length > 1) {
    const del = document.createElement("button");
    del.textContent = "Удалить страницу";
    del.title = "Виджеты удаляемой страницы переходят на предыдущую";
    del.onclick = () => act(async () => {
      const keep = names.filter((_, i) => i + 1 !== curPage);
      for (const b of (schema.logic.block || []).filter(isWidget)) {
        const pg = pageOf(b);
        if (pg >= curPage) await api("set_params", { id: b.id, params: { page: Math.max(1, pg - 1) } });
      }
      await api("set_params", { id: host.id, params: { pages: keep.join(";") } });
      curPage = Math.max(1, curPage - 1);
    });
    t.appendChild(del);
  }
}

function itemEl(b) {
  const t = types[b.type];
  const { c, r, w, h } = rect(b);
  const el = document.createElement("div");
  el.className = "item" + (b.id === selected ? " sel" : "");
  place(el, c, r, w, h);
  const cap = document.createElement("b");
  cap.textContent = String(widgetParam(b, "caption", b.id));
  const sub = document.createElement("span");
  sub.textContent = `${t ? t.name : b.type} · ${b.id}`;
  el.append(cap, sub);
  const rs = document.createElement("div");
  rs.className = "rs";
  el.appendChild(rs);
  drag(el, rs, b);
  return el;
}
function place(el, c, r, w, h) {
  el.style.left = (c - 1) * (CW + GAP) + "px";
  el.style.top = (r - 1) * (CH + GAP) + "px";
  el.style.width = w * (CW + GAP) - GAP + "px";
  el.style.height = h * (CH + GAP) - GAP + "px";
}

function drag(el, handle, b) {
  el.addEventListener("pointerdown", (ev) => {
    const resize = ev.target === handle;
    const start = { x: ev.clientX, y: ev.clientY, ...rect(b) };
    let cur = { ...start }, moved = false;
    el.setPointerCapture(ev.pointerId);
    if (selected !== b.id) { selected = b.id; renderProps(); document.querySelectorAll(".item").forEach((e) => e.classList.remove("sel")); el.classList.add("sel"); }
    const move = (e) => {
      const dc = Math.round((e.clientX - start.x) / (CW + GAP));
      const dr = Math.round((e.clientY - start.y) / (CH + GAP));
      if (dc || dr) moved = true;
      if (resize) {
        cur = { ...start, w: Math.max(1, Math.min(COLS - start.c + 1, start.w + dc)), h: Math.max(1, start.h + dr) };
      } else {
        cur = { ...start, c: Math.max(1, Math.min(COLS - start.w + 1, start.c + dc)), r: Math.max(1, start.r + dr) };
      }
      place(el, cur.c, cur.r, cur.w, cur.h);
    };
    const up = async () => {
      el.removeEventListener("pointermove", move);
      el.removeEventListener("pointerup", up);
      if (!moved) return;
      await act(async () => {
        await api("set_params", { id: b.id, params: { col: cur.c, row: cur.r, w: cur.w, h: cur.h } });
      });
    };
    el.addEventListener("pointermove", move);
    el.addEventListener("pointerup", up);
  });
}

function renderProps() {
  const el = $("props");
  el.textContent = "";
  const b = (schema.logic.block || []).find((x) => x.id === selected && isWidget(x));
  const host = (schema.logic.block || []).find((x) => x.type === "web_ui");
  const h = document.createElement("h2");
  h.textContent = b ? `${types[b.type]?.name || b.type} · ${b.id}` : "Свойства";
  el.appendChild(h);
  if (!b) {
    if (host) for (const hp of types.web_ui.params) el.appendChild(paramField(host, hp));
    const p = document.createElement("p");
    p.className = "hint";
    p.textContent = "Выберите виджет в палитре слева (щелчок или перетаскивание в сетку). Выделите виджет, чтобы настроить подпись, единицы и привязку к схеме.";
    el.appendChild(p);
    return;
  }
  const t = types[b.type];
  for (const p of t.params) el.appendChild(paramField(b, p));

  bindingsSection(el, b);
  const del = document.createElement("button");
  del.textContent = "Удалить виджет";
  del.style.marginTop = "14px";
  del.onclick = () => act(async () => { await api("remove_block", { id: b.id }); selected = null; });
  el.appendChild(del);
}

// ---- preview: the device page with its three requests answered locally ----
function renderPreview(widgets, host) {
  const layout = {
    t: host ? String(widgetParam(host, "title", "")) : "Панель", p: pageNames(host).join(";"), i: [],
    bg: host ? String(widgetParam(host, "bg", "")) : "", y: host && widgetParam(host, "system", true) ? 1 : 0,
  };
  const state = [];
  for (const b of widgets) {
    const k = b.type.slice(4);
    const r = rect(b);
    const g = (n, d) => { const x = widgetParam(b, n, d); return x === undefined || x === null ? d : x; };
    const min = num(g("min", 0), 0), max = num(g("max", 0), 0);
    layout.i.push({
      k, l: String(g("caption", "")), u: String(g("unit", "")), c: r.c, r: r.r, w: r.w, h: r.h, g: pageOf(b),
      d: k === "value" || k === "tank" ? num(g("decimals", k === "tank" ? 0 : 1), 1) : (k === "gauge" ? 1 : 3),
      a: min, b: max, s: num(g("step", 1), 1),
      o: String(g("color", "")), q: String(g("back", "")),
    });
    const last = layout.i[layout.i.length - 1];
    if (k === "icon") last.a = num(g("icon", 0), 0);
    if (k === "image") { last.u = String(g("url", "")); last.a = g("fit", true) ? 1 : 0; }
    if (k === "clock") { last.a = g("seconds", true) ? 1 : 0; last.b = g("date", true) ? 1 : 0; }
    if (k === "chart") last.s = num(g("period", 5), 5);
    if (k === "shape") { last.a = num(g("shape", 0), 0); last.b = num(g("thickness", 2), 2); last.l = String(g("caption", "")); }
    let v = 0;
    if (k === "switch") v = g("initial", false) ? 1 : 0;
    else if (k === "slider" || k === "input") v = num(g("initial", 0), 0);
    else if (k === "led" || k === "icon") v = 1;
    else if (k === "gauge" || k === "tank") v = (min + max) / 2;
    else if (k === "value") v = 12.3;
    else if (k === "text") v = "Текст со входа";
    else if (k === "net") v = [g("ssid", ""), "", g("dhcp", true) ? "1" : "0", g("ip", ""), g("gateway", ""), g("subnet", ""), g("ap_ssid", ""), "", String(g("init_mode", 0)), String(g("init_ap_delay", 30))].join("\n");
    state.push(v);
  }
  const shim = `<script>
var L=${JSON.stringify(layout)},S=${JSON.stringify(state)};
window.fetch=function(u){u=String(u);
 if(u.indexOf('/ui/layout')==0)return Promise.resolve({json:function(){return Promise.resolve(L)}});
 if(u.indexOf('/ui/state')==0)return Promise.resolve({json:function(){return Promise.resolve(S)}});
 if(u.indexOf('/ui/hist')==0){var a=[];for(var j=0;j<60;j++)a.push(Math.round(50+30*Math.sin(j/6)+8*Math.sin(j*1.7)));return Promise.resolve({json:function(){return Promise.resolve(a)}})}
 if(u.indexOf('/ui/scan')==0)return Promise.resolve({text:function(){return Promise.resolve('HomeNet'+String.fromCharCode(9)+'-48'+String.fromCharCode(10)+'Guest'+String.fromCharCode(9)+'-71'+String.fromCharCode(10))}});
 if(u.indexOf('/ui/info')==0)return Promise.resolve({json:function(){return Promise.resolve({ip:'192.168.1.50',mac:'AA:BB:CC:DD:EE:FF',rssi:-58,up:93784,chip:'ESP32',cpu:240,heap:210000,heapAll:320000,flash:4194304,sketch:900000,free:1000000,build:'предпросмотр'})}})
 var m=/[?&]i=(\\d+)&v=([^&]*)/.exec(u);if(m)S[+m[1]]=+m[2];
 return Promise.resolve({})};
<\/script>`;
  $("preview").srcdoc = pageHtml.replace("</head>", shim + "</head>");
}


function setMode(preview) {
  previewMode = preview;
  applyVisibility();
  $("modeEdit").classList.toggle("on", !preview);
  $("modeView").classList.toggle("on", preview);
}
function applyVisibility() {
  $("grid").hidden = previewMode;
  $("preview").hidden = !previewMode;
}
$("modeEdit").onclick = () => setMode(false);
$("modeView").onclick = () => setMode(true);

$("addHost").onclick = () => act(async () => { await api("add_block", { type: "web_ui", id: "ui" }); });

function renderWidgetPalette() {
  const items = Object.values(types).filter((x) => x.type.startsWith("web_") && x.type !== "web_ui")
    .sort((a, b) => a.name.localeCompare(b.name, "ru")).map((t) => ({ key: t.type, name: t.name }));
  buildPalette(items, (type) => addWidget(type), "Виджеты");
}
// Adds a widget of `type` to the current page: at cell (col, row) when given (palette drop), else at the end.
function addWidget(type, col, row) {
  act(async () => {
    await freshSchema();
    const id = uniqueId(type.slice(4));
    await api("add_block", { type, id });
    const w = rect({ type });
    const c = col === undefined ? 1 : Math.max(1, Math.min(COLS - w.w + 1, col));
    await api("set_params", { id, params: { page: curPage, col: c, row: row === undefined ? bottomRow() + 1 : Math.max(1, row) } });
    selected = id;
  });
}

(async function init() {
  try {
    await loadTypes(["web_"], (t) => t.group === GROUP);
    const r = await fetch("/ui_page.html");
    if (!r.ok) throw new Error(await r.text());
    pageHtml = await r.text();
    await reload();
    say("Готово. Изменения сохраняются в проект сразу; прошивку соберите в редакторе схемы или командой crablogic build.");
  } catch (e) { say(e.message, true); }
})();
startPolling();
</script>
</body>
</html>
