[package]
name = "crab-codegen"
description = "Firmware code generation from CrabLogic schemas"
version.workspace = true
edition.workspace = true

[dependencies]
crab-blocks = { path = "../crab-blocks" }
crab-core = { path = "../crab-core" }
crab-debug = { path = "../crab-debug" }
minijinja = { version = "2", features = ["unicode"] }
thiserror.workspace = true
wasm-encoder = { version = "0.263.0", features = ["wasmparser"] }
wasmparser = "0.263"

[dev-dependencies]
toml.workspace = true
wat = "1.263.0"
wasmprinter = "0.263.0"
