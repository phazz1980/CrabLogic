# A display with the menu on one sheet: the test replaces UP_VALUE and DOWN_VALUE.

[[var]]
name = "setpoint"
type = "float"
init = 20.0
retain = true

[[var]]
name = "enabled"
type = "bool"

[[var]]
name = "level"
type = "float"
init = 3.0

[[block]]
id = "oled"
type = "oled"

[[block]]
id = "temp"
type = "disp_value"
display = "oled"
screen = 1
x = 0
y = 16
w = 48
h = 8
[block.const]
in = 5.0

[[block]]
id = "bar"
type = "disp_bar"
display = "oled"
screen = 2
x = 0
y = 8
w = 64
h = 8
[block.bind]
in = "level"

[[block]]
id = "m"
type = "menu"
display = "oled"
[block.const]
up = UP_VALUE
down = DOWN_VALUE

[[block]]
id = "sub"
type = "menu_item"
menu = "m"
kind = "submenu"
caption = "Настройки"

[[block]]
id = "sp"
type = "menu_item"
menu = "m"
parent = "sub"
kind = "number"
caption = "Уставка"
var = "setpoint"
min = 0.0
max = 100.0
step = 0.5

[[block]]
id = "en"
type = "menu_item"
menu = "m"
kind = "bool"
caption = "Работа"
var = "enabled"

[[block]]
id = "sp_mon"
type = "var_get"
var = "setpoint"

[[block]]
id = "en_mon"
type = "var_get"
var = "enabled"
