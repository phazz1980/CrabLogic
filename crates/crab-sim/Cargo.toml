[package]
name = "crab-sim"
version.workspace = true
edition.workspace = true
description = "Runs WASM block modules (wasmi) to simulate a block on the PC"

[dependencies]
wasmparser = "0.263"
crab-core = { path = "../crab-core" }
crab-blocks = { path = "../crab-blocks" }
crab-kernel = { path = "../crab-kernel", features = ["serde", "std"] }
wasmi = "2.0.0"
# The display driver runs on the host to draw the screens in the simulation.
display = { path = "../../drivers/display" }
serde.workspace = true
toml.workspace = true

[dev-dependencies]
wat = "1.263.0"
crab-codegen = { path = "../crab-codegen" }
