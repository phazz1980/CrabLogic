[package]
name = "crab-debug"
description = "Online debugging protocol and host session of CrabLogic"
version.workspace = true
edition.workspace = true

[features]
default = []
# Serial port transport (USB). Off for crates that only need the protocol.
serial = ["dep:serialport"]
# Network transport (TCP port of the master with the challenge-response login).
net = ["dep:sha2", "dep:hmac"]

[dependencies]
crab-core = { path = "../crab-core" }
crab-netfind = { path = "../crab-netfind" }
thiserror.workspace = true
serialport = { version = "4", optional = true, default-features = false }
sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
# Lists the IPv4 adapters of this computer for the board search (`find`).
if-addrs = "0.13"
