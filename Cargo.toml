[workspace]
resolver = "2"
members = ["crates/*"]
# The drivers are separate crates (their own workspace, built for wasm); `display` is also used by
# the simulator as a path dependency; `lora_e220` gives the generator its config format.
exclude = ["drivers/display", "drivers/lora_e220"]

[workspace.package]
version = "2.2.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

# Keep target/debug small: PDB debug info of every test binary and dependency
# was the main source of growth (152 GB). Line tables are enough for backtraces.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
lto = "thin"
opt-level = "s"
