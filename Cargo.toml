[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "2.0.1"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

# Keep target/debug small: PDB debug info of every test binary and dependency
# was the main source of growth (152 GB). Line tables are enough for backtraces.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.release]
strip = true
lto = "thin"
opt-level = "s"
