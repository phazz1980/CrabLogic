[package]
name = "crab-master-rs"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

# This firmware is deliberately outside the workspace: ESP-IDF uses its own
# target/toolchain and must not affect desktop builds.
[workspace]

[dependencies]
crab-kernel = { path = "../../crates/crab-kernel", default-features = false }

[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = { version = "0.51", features = ["binstart", "native"] }
crab-sparkplug = { path = "../../crates/crab-sparkplug" }

[build-dependencies]
embuild = { version = "0.33", features = ["espidf"] }
wat = "1"

# WAMR is built as an ESP-IDF component from `.deps/wamr` (see README).
[package.metadata.esp-idf-sys]
esp_idf_sdkconfig_defaults = ["sdkconfig.defaults"]

[[package.metadata.esp-idf-sys.extra_components]]
component_dirs = ["components/crab_wamr"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = "s"
panic = "abort"
