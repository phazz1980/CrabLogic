[block]
type = "chip_temp"
name = "Температура чипа"
symbol = "T чип"
group = "Мои блоки"
description = "Встроенный датчик температуры кристалла (ESP32-C3, S2, S3, C6). Это температура чипа, а не воздуха."
memory = true

[[output]]
name = "temp"
label = "Температура"
type = "int"
description = "Температура кристалла, °C (до первого замера и на ESP32 без датчика — 0)"

[[output]]
name = "ok"
label = "Готово"
type = "bool"
description = "true, если у чипа есть датчик и замер выполнен"

[[param]]
name = "period"
label = "Период"
type = "duration"
default = "1s"
min = 100.0
description = "Период опроса датчика"
